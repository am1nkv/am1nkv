  <text x="500" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3" fill="#8E5E74">THANKS FOR FLYING BY  ·  SEE YOU AT THE NEXT COMMIT</text>
</svg>
