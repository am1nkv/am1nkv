<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-label="Thanks for flying by. See you at the next commit.">
  <path id="trail" d="M60 62 C 260 20, 420 86, 620 44 S 900 40, 940 50" fill="none" stroke="#E7B9CB" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/>
  <g transform="translate(620 44) rotate(-8)"><path d="M-11 -2 L4 -2 L10 -9 L13 -9 L9 -2 L14 -2 L16 -5 L18 -5 L17 0 L18 5 L16 5 L14 2 L9 2 L13 9 L10 9 L4 2 L-11 2 Q-14 0 -11 -2 Z" fill="#E0457F"/><set attributeName="opacity" to="0" begin="0s"/></g>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="0s"/>
    <path d="M-11 -2 L4 -2 L10 -9 L13 -9 L9 -2 L14 -2 L16 -5 L18 -5 L17 0 L18 5 L16 5 L14 2 L9 2 L13 9 L10 9 L4 2 L-11 2 Q-14 0 -11 -2 Z" fill="#E0457F"/>
