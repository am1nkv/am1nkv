<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Boarding pass: Hi, I'm Amina. CS master's student at Dauphine-PSL, apprentice Decision Support Engineer at Air France-KLM. Flight from Paris to AI and data.">
  <defs>
    <mask id="notch">
      <rect width="1000" height="360" fill="#fff"/>
      <circle cx="760" cy="0" r="18" fill="#000"/>
      <circle cx="760" cy="360" r="18" fill="#000"/>
    </mask>
  </defs>

  <g mask="url(#notch)">
    <rect x="1" y="1" width="998" height="358" rx="26" fill="#FFF7F2" stroke="#F1D9E2" stroke-width="2"/>
    <rect x="760" y="1" width="239" height="358" fill="#FFEFF4"/>
    <rect x="1" y="1" width="998" height="358" rx="26" fill="none" stroke="#F1D9E2" stroke-width="2"/>
  </g>
  <line x1="760" y1="30" x2="760" y2="330" stroke="#E7B9CB" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/>

  <!-- main -->
  <text x="48" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="3" fill="#8E5E74">BOARDING PASS  ·  CLASS: CURIOUS</text>
  <circle cx="704" cy="57" r="5" fill="#7FD8B5"/>
  <text x="694" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="2" fill="#1F6B50" text-anchor="end">ONLINE</text>

  <text x="46" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#2B1F27" letter-spacing="-1.5">Hi, I’m <tspan fill="#E0457F">Amina</tspan></text>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#6B5560">
    <text x="48" y="164">CS master’s student @ Paris Dauphine–PSL<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/></text>
    <text x="48" y="164" opacity="0">Apprentice Decision Support Engineer @ Air France-KLM<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/></text>
    <text x="48" y="164" opacity="0">Always learning, always building<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.3;0.34;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>
  </g>

  <!-- flight -->
  <text x="48" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="36" font-weight="700" fill="#2B1F27">PAR</text>
  <text x="48" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2" fill="#8E5E74">CS · PARIS</text>
  <path id="route" d="M150 228 Q 335 170 520 228" fill="none" stroke="#E7B9CB" stroke-width="2" stroke-dasharray="3 8" stroke-linecap="round"/>
  <circle cx="150" cy="228" r="4" fill="#E0457F"/>
  <circle cx="520" cy="228" r="4" fill="#7FD8B5"/>
  <g transform="translate(335 199)"><path d="M-11 -2 L4 -2 L10 -9 L13 -9 L9 -2 L14 -2 L16 -5 L18 -5 L17 0 L18 5 L16 5 L14 2 L9 2 L13 9 L10 9 L4 2 L-11 2 Q-14 0 -11 -2 Z" fill="#E0457F"/><set attributeName="opacity" to="0" begin="0s"/></g>
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="0s"/>
    <path d="M-11 -2 L4 -2 L10 -9 L13 -9 L9 -2 L14 -2 L16 -5 L18 -5 L17 0 L18 5 L16 5 L14 2 L9 2 L13 9 L10 9 L4 2 L-11 2 Q-14 0 -11 -2 Z" fill="#E0457F"/>
    <animateMotion dur="5s" repeatCount="indefinite" rotate="auto" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1">
      <mpath href="#route" xlink:href="#route"/>
    </animateMotion>
  </g>
  <text x="544" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="36" font-weight="700" fill="#2B1F27">A.I.</text>
  <text x="544" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="2" fill="#8E5E74">AI &amp; DATA</text>

  <!-- fields -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2" fill="#8E5E74">
    <text x="48" y="300">PASSENGER</text>
    <text x="200" y="300">CREW</text>
    <text x="382" y="300">SCHOOL</text>
    <text x="560" y="300">LANGUAGES</text>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2B1F27">
    <text x="48" y="324">am1nkv</text>
    <text x="200" y="324">Air France-KLM</text>
    <text x="382" y="324">Dauphine–PSL</text>
    <text x="560" y="324">FR · EN · RU · KZ</text>
  </g>

  <!-- stub -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" letter-spacing="2" fill="#8E5E74">
    <text x="792" y="62">STATUS</text>
    <text x="792" y="126">GROUP</text>
  </g>
  <text x="792" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1F6B50">On time<tspan fill="#7FD8B5"> ●<animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1.6s" repeatCount="indefinite"/></tspan></text>
  <text x="792" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#2B1F27">Builders</text>
